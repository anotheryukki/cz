<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Crypto Caper — $CZ Games</title>
<meta name="description" content="Crypto Caper — a pixel-art puzzle-platformer. Run, jump, and hack your way through the office to secure the data." />
<link rel="icon" type="image/jpeg" href="pfp.jpg" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=VT323&family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />

<script src="https://cdn.tailwindcss.com"></script>

<style>
  :root{
    --ink:#0a0a0a;
    --paper:#fbfbf3;
    --yellow:#f3ba2f;
    --yellow-deep:#c98f0a;
    --pencil:#a9a89f;
    --sap:#7a9a4a;
    --rust:#c1443c;
  }

  *{ box-sizing:border-box; }

  html, body{ height:100%; overscroll-behavior:none; }
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:'VT323', monospace;
    cursor:crosshair;
    overflow:hidden;
    touch-action:none;
  }

  a, button{ cursor:pointer; }
  .marker{ font-family:'Permanent Marker', cursive; }

  html[lang="zh"] [data-i18n],
  html[lang="zh"] [data-i18n-html],
  html[lang="zh"] .i18n-frag{
    font-family:'Noto Sans SC', sans-serif;
  }
  html[lang="zh"] [data-i18n].marker,
  html[lang="zh"] [data-i18n-html].marker{
    font-family:'Ma Shan Zheng', cursive;
  }

  .lang-toggle{
    display:inline-flex; align-items:center; padding:0.3rem 0.7rem;
    border:2px solid var(--yellow); border-radius:999px;
    background:rgba(243,186,47,0.1); color:var(--yellow);
    font-family:'Permanent Marker', cursive;
    transition:transform .2s cubic-bezier(.34,1.56,.64,1), background .2s ease;
  }
  .lang-toggle:hover{ transform:rotate(-2deg) scale(1.06); background:rgba(243,186,47,0.22); }
  .lang-toggle:active{ transform:rotate(-2deg) scale(0.95); }
  .lang-toggle:focus-visible{ outline:3px dashed var(--paper); outline-offset:4px; }

  .bg-video-wrap{ position:fixed; inset:0; z-index:-30; overflow:hidden; }
  .bg-video-wrap video{
    position:absolute; top:50%; left:50%;
    min-width:100%; min-height:100%; width:auto; height:auto;
    transform:translate(-50%,-50%);
    object-fit:cover;
    filter:saturate(0.7) contrast(1.05) brightness(0.6);
  }
  .bg-overlay{ position:fixed; inset:0; z-index:-20; background:rgba(0,0,0,0.82); }
  .bg-grain{ position:fixed; inset:0; z-index:-10; opacity:0.05; mix-blend-mode:overlay; pointer-events:none; }

  .doodle{ position:relative; }
  .doodle-svg{ position:absolute; top:-10px; left:-10px; pointer-events:none; overflow:visible; }
  .doodle-svg path{
    fill:none; stroke-width:3; vector-effect:non-scaling-stroke; stroke-linecap:round; stroke-linejoin:round;
  }

  .nav-link{ transition:color .2s ease, transform .2s ease; }
  .nav-link:hover{ color:var(--yellow); transform:translateY(-1px); }
  .nav-link:focus-visible{ outline:2px dashed var(--paper); outline-offset:4px; }

  .site-header{ position:relative; z-index:40; flex-shrink:0; }

  #game-canvas{
    display:block;
    background:#050505;
    touch-action:none;
    border-radius:2px;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
  }

  .game-shell{
    display:flex; flex-direction:column; align-items:center;
    height:100%;
    padding:0 1rem;
  }

  .pad-btn{
    display:flex; align-items:center; justify-content:center;
    width:52px; height:52px;
    background:rgba(243,186,47,0.12);
    border:2px solid var(--yellow);
    color:var(--yellow);
    border-radius:10px;
    user-select:none;
    font-family:'Permanent Marker', cursive;
    font-size:1.1rem;
  }
  .pad-btn:active{ background:rgba(243,186,47,0.35); }
  .pad-btn.mic-btn{ border-color:var(--sap); color:var(--sap); background:rgba(122,154,74,0.14); }
  .pad-btn.mic-btn:active{ background:rgba(122,154,74,0.35); }

  @media (prefers-reduced-motion: reduce){
    .nav-link{ transition:none !important; }
  }
</style>
</head>
<body>

  <div class="bg-video-wrap">
    <video autoplay muted loop playsinline id="bgvideo">
      <source src="czcz.mp4" type="video/mp4" />
    </video>
  </div>
  <div class="bg-overlay"></div>
  <svg class="bg-grain" width="100%" height="100%">
    <filter id="noiseFilter">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence>
      <feColorMatrix type="saturate" values="0"></feColorMatrix>
    </filter>
    <rect width="100%" height="100%" filter="url(#noiseFilter)"></rect>
  </svg>

  <svg width="0" height="0" style="position:absolute">
    <symbol id="doodleRect" viewBox="0 0 300 100" preserveAspectRatio="none">
      <path fill="none" d="M8,3 L60,1 L130,3 L200,1 L292,3
               L297,34 L300,64 L297,96
               L230,98 L150,99 L78,98 L4,99
               L1,62 L4,30 Z" />
    </symbol>
  </svg>

  <div class="game-shell">
    <header class="site-header flex items-center justify-between w-full max-w-[720px] py-3 gap-2">
      <a href="games.html" data-i18n="navGames" class="marker text-base sm:text-lg text-[var(--paper)] nav-link">◂ GAMES</a>
      <span class="marker text-lg sm:text-xl text-[var(--yellow)] rotate-[-1deg]">CRYPTO CAPER</span>
      <span class="flex items-center gap-3 text-sm sm:text-base text-[var(--pencil)]">
        <button id="lang-toggle" type="button" class="lang-toggle text-xs sm:text-sm rotate-[-1deg]" aria-label="Switch language">中文</button>
        <span id="mic-status">🎤 <span id="mic-status-text" class="text-[var(--pencil)]">LOCKED</span></span>
        <span>◆ <b id="data-label" class="text-[var(--paper)]">0/4</b></span>
      </span>
    </header>

    <div class="doodle relative mt-1 sm:mt-3" id="canvas-wrap">
      <svg class="doodle-svg" preserveAspectRatio="none"><use href="#doodleRect" stroke="var(--yellow)" fill="none"></use></svg>
      <div class="doodle-content">
        <canvas id="game-canvas"></canvas>
      </div>
    </div>

    <p class="text-xs sm:text-sm text-[var(--pencil)] mt-3 text-center" data-i18n="hintText">WASD move &amp; jump &middot; J to hack</p>

    <div id="touch-pad" class="fixed bottom-4 left-0 right-0 px-4 flex items-end justify-between pointer-events-none" style="display:none;">
      <div class="flex gap-3 pointer-events-auto">
        <div class="pad-btn" data-key="a">◂</div>
        <div class="pad-btn" data-key="d">▸</div>
      </div>
      <div class="flex gap-3 pointer-events-auto">
        <div class="pad-btn mic-btn" data-key="j">♪</div>
        <div class="pad-btn" data-key="w">▲</div>
      </div>
    </div>
  </div>

  <script>
    // ================= canvas + responsive fit (integer pixel scale) =================
    const GAME_W = 320, GAME_H = 180;
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    const wrap = document.getElementById('canvas-wrap');

    function sizeDoodle() {
      const svg = wrap.querySelector('.doodle-svg');
      const content = wrap.querySelector('.doodle-content');
      svg.style.width = content.offsetWidth + 20 + 'px';
      svg.style.height = content.offsetHeight + 20 + 'px';
    }

    function fitCanvas() {
      const header = document.querySelector('.site-header');
      const hint = document.querySelector('.game-shell > p');
      const touchPad = document.getElementById('touch-pad');
      const padSpace = touchPad.style.display !== 'none' ? 90 : 0;
      const reserved = (header ? header.offsetHeight : 60) + (hint ? hint.offsetHeight : 24) + 48 + padSpace;

      const availW = window.innerWidth * 0.94;
      const availH = Math.max(160, window.innerHeight - reserved);

      let scale = Math.floor(Math.min(availW / GAME_W, availH / GAME_H));
      if (scale < 1) scale = 1;

      const dispW = GAME_W * scale, dispH = GAME_H * scale;
      canvas.style.width = dispW + 'px';
      canvas.style.height = dispH + 'px';
      canvas.width = GAME_W * scale;
      canvas.height = GAME_H * scale;

      ctx.setTransform(scale, 0, 0, scale, 0, 0);
      ctx.imageSmoothingEnabled = false;

      sizeDoodle();
    }
    window.addEventListener('resize', fitCanvas);
    window.addEventListener('orientationchange', fitCanvas);

    if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) {
      document.getElementById('touch-pad').style.display = 'flex';
    }

    // ================= language =================
    const LANG_KEY = 'cz-lang';
    const I18N = {
      en: {
        navGames: '◂ GAMES',
        hintText: 'WASD move &amp; jump &middot; J to hack',
        micLocked: 'LOCKED',
        micReady: 'READY',
        readyWasd: 'WASD MOVE + JUMP',
        readyFindMic: 'FIND THE MIC TO UNLOCK J',
        pressAnyKey: 'PRESS ANY KEY TO START',
        networkSecured: 'NETWORK SECURED',
        timeLabel: 'TIME',
        deathsLabel: 'DEATHS',
        replayPrompt: 'R TO REPLAY',
        findMicFirst: 'FIND THE MIC FIRST',
        platformStabilized: 'PLATFORM STABILIZED',
        droneDisabled: 'DRONE DISABLED',
        gateOpened: 'GATE OPENED',
        micUnlockedMsg: 'MIC UNLOCKED — J TO HACK',
        walkIntoMic: 'WALK INTO THE MIC',
        timeTheLaser: 'TIME THE LASER',
        needMoreData: 'NEED {n} MORE DATA',
        jToStabilize: 'J TO STABILIZE',
        needTheMic: 'NEED THE MIC',
        jToDisableDrone: 'J TO DISABLE DRONE',
        jToHackSwitch: 'J TO HACK SWITCH',
      },
      zh: {
        navGames: '◂ 游戏',
        hintText: 'WASD 移动跳跃 &middot; J 破解',
        micLocked: '未解锁',
        micReady: '已解锁',
        readyWasd: 'WASD 移动 + 跳跃',
        readyFindMic: '找到麦克风以解锁 J',
        pressAnyKey: '按任意键开始',
        networkSecured: '网络已安全',
        timeLabel: '用时',
        deathsLabel: '死亡次数',
        replayPrompt: '按 R 重新挑战',
        findMicFirst: '先找到麦克风',
        platformStabilized: '平台已稳定',
        droneDisabled: '无人机已禁用',
        gateOpened: '闸门已打开',
        micUnlockedMsg: '麦克风已解锁 — 按 J 破解',
        walkIntoMic: '走向麦克风拾取',
        timeTheLaser: '掌握激光时机',
        needMoreData: '还需 {n} 个数据块',
        jToStabilize: '按 J 稳定平台',
        needTheMic: '需要麦克风',
        jToDisableDrone: '按 J 禁用无人机',
        jToHackSwitch: '按 J 破解开关',
      },
    };
    function getLang() { return localStorage.getItem(LANG_KEY) === 'zh' ? 'zh' : 'en'; }
    function T(key, vars) {
      let s = I18N[getLang()][key];
      if (vars) Object.keys(vars).forEach((k) => { s = s.replace('{' + k + '}', vars[k]); });
      return s;
    }
    function markerFont(px) { return px + "px '" + (getLang() === 'zh' ? 'Ma Shan Zheng' : 'Permanent Marker') + "', cursive"; }
    function bodyFont(px) { return px + "px '" + (getLang() === 'zh' ? 'Noto Sans SC' : 'VT323') + "', monospace"; }

    function updateMicStatusLabel() {
      const micText = document.getElementById('mic-status-text');
      micText.textContent = player.micUnlocked ? T('micReady') : T('micLocked');
      micText.className = player.micUnlocked ? 'text-[var(--yellow)]' : 'text-[var(--pencil)]';
    }

    function applyLang(lang) {
      document.documentElement.lang = lang;
      document.querySelectorAll('[data-i18n]').forEach((el) => {
        const key = el.getAttribute('data-i18n');
        if (I18N[lang][key] !== undefined) el.innerHTML = I18N[lang][key];
      });
      const toggle = document.getElementById('lang-toggle');
      if (toggle) toggle.textContent = lang === 'zh' ? 'EN' : '中文';
      updateMicStatusLabel();
      sizeDoodle();
    }
    document.getElementById('lang-toggle').addEventListener('click', () => {
      const next = getLang() === 'zh' ? 'en' : 'zh';
      localStorage.setItem(LANG_KEY, next);
      applyLang(next);
    });

    // ================= palette =================
    const COL = {
      skin: '#f2c9a1',
      shirt: '#141414',
      accent: '#f3ba2f',
      pants: '#5c5c5c',
      shoe: '#0a0a0a',
      mic: '#9a9a9a',
      floor: '#2a2a2a',
      floorEdge: '#f3ba2f',
      glitchOff: 'rgba(243,186,47,0.25)',
      glitchOn: '#f3ba2f',
    };

    // ================= physics constants =================
    const GRAVITY = 420;
    const JUMP_V = -150;
    const MOVE_SPEED = 72;
    const MAX_FALL = 260;
    const COYOTE_TIME = 0.1;
    const JUMP_BUFFER = 0.12;

    // ================= level data =================
    const LEVEL_W = 1400, LEVEL_H = 180;

    const solids = [
      { x: 0, y: 164, w: 260, h: 40 },
      { x: 300, y: 164, w: 90, h: 40 },
      { x: 480, y: 164, w: 130, h: 40 },
      { x: 610, y: 164, w: 340, h: 40 },
      { x: 990, y: 164, w: 260, h: 40 },
      { x: 1250, y: 164, w: 150, h: 40 },

      { x: 750, y: 145, w: 60, h: 10 },
      { x: 1090, y: 145, w: 30, h: 10 },
      { x: 1142, y: 145, w: 70, h: 10 },
      { x: 1285, y: 145, w: 40, h: 10 },
    ];

    const gate = { x: 1130, y: 100, w: 12, h: 64, open: false };
    const glitchPlat = { x: 400, y: 150, w: 70, h: 10, active: false, timer: 0, maxTimer: 3.5 };

    const dataBlocks = [
      { x: 335, y: 150, w: 10, h: 10, collected: false },
      { x: 770, y: 130, w: 10, h: 10, collected: false },
      { x: 1170, y: 128, w: 10, h: 10, collected: false },
      { x: 1300, y: 128, w: 10, h: 10, collected: false },
    ];
    const TOTAL_DATA = dataBlocks.length;

    const micPickup = { x: 100, y: 150, w: 10, h: 14, collected: false };
    const switchObj = { x: 1030, y: 152, w: 10, h: 12, activated: false };

    const drone = { x: 700, y: 132, w: 16, h: 10, minX: 700, maxX: 834, dir: 1, speed: 40, disabledTimer: 0 };

    const laserEye = { x: 876, y: 40, w: 8, cycle: 2.4, t: 0 };

    const monitors = [ { x: 200, y: 130 }, { x: 660, y: 130 }, { x: 1200, y: 40 } ];

    const server = { x: 1360, y: 130, w: 24, h: 34 };

    const SPAWN = { x: 20, y: 130 };

    // ================= player =================
    const player = {
      x: SPAWN.x, y: SPAWN.y, w: 10, h: 16,
      vx: 0, vy: 0,
      grounded: false, facing: 1,
      coyote: 0, jumpBuffer: 0,
      micUnlocked: false, micCooldown: 0,
      invuln: 0,
      walkT: 0,
    };

    let camera = { x: 0 };
    let state = 'ready'; // ready | playing | win
    let dataCount = 0;
    let deaths = 0;
    let elapsed = 0;
    let animT = 0;
    let idleTimer = 0;
    let pulses = [];
    let particles = [];
    let binaryStr = '';
    for (let i = 0; i < 400; i++) binaryStr += Math.random() < 0.5 ? '0' : '1';

    document.getElementById('data-label').textContent = '0/' + TOTAL_DATA;

    // ================= input =================
    const keys = { a: false, d: false, w: false, j: false };

    function setKey(k, v) {
      if (!(k in keys)) return;
      const wasDown = keys[k];
      keys[k] = v;
      if (v && !wasDown) {
        idleTimer = 0;
        if (state === 'ready') { state = 'playing'; lastTime = null; }
        if (k === 'w') player.jumpBuffer = JUMP_BUFFER;
        if (k === 'j') tryMicHack();
      }
    }

    window.addEventListener('keydown', (e) => {
      const code = e.code;
      if (code === 'KeyA' || code === 'ArrowLeft') { setKey('a', true); e.preventDefault(); }
      else if (code === 'KeyD' || code === 'ArrowRight') { setKey('d', true); e.preventDefault(); }
      else if (code === 'KeyW' || code === 'ArrowUp' || code === 'Space') { setKey('w', true); e.preventDefault(); }
      else if (code === 'KeyJ') { setKey('j', true); e.preventDefault(); }
    });
    window.addEventListener('keyup', (e) => {
      const code = e.code;
      if (code === 'KeyA' || code === 'ArrowLeft') keys.a = false;
      else if (code === 'KeyD' || code === 'ArrowRight') keys.d = false;
      else if (code === 'KeyW' || code === 'ArrowUp' || code === 'Space') keys.w = false;
      else if (code === 'KeyJ') keys.j = false;
    });

    document.querySelectorAll('.pad-btn').forEach((btn) => {
      const k = btn.getAttribute('data-key');
      btn.addEventListener('pointerdown', (e) => { e.preventDefault(); setKey(k, true); });
      btn.addEventListener('pointerup', (e) => { e.preventDefault(); keys[k] = false; });
      btn.addEventListener('pointerleave', () => { keys[k] = false; });
      btn.addEventListener('pointercancel', () => { keys[k] = false; });
    });
    canvas.addEventListener('pointerdown', () => { if (state === 'ready') { state = 'playing'; lastTime = null; } });

    let hudMessage = null, hudMessageTimer = 0, hudMessageColor = '#ff6b5e';
    function showMessage(text, duration, color) {
      hudMessage = text;
      hudMessageTimer = duration || 1.3;
      hudMessageColor = color || '#ff6b5e';
    }

    function tryMicHack() {
      if (state !== 'playing') return;
      if (!player.micUnlocked) { showMessage(T('findMicFirst')); return; }
      if (player.micCooldown > 0) return;
      player.micCooldown = 1.2;
      pulses.push({
        x: player.x + player.w / 2, y: player.y + player.h / 2,
        r: 0, maxR: 76, hitGlitch: false, hitDrone: false, hitSwitch: false,
      });
    }

    // ================= helpers =================
    function rectOverlap(a, b) {
      return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    }
    function dist(x1, y1, x2, y2) { return Math.hypot(x1 - x2, y1 - y2); }

    function activeSolids() {
      const list = solids.slice();
      if (!gate.open) list.push(gate);
      if (glitchPlat.active) list.push(glitchPlat);
      return list;
    }

    function respawnPlayer() {
      player.x = SPAWN.x; player.y = SPAWN.y;
      player.vx = 0; player.vy = 0;
      player.invuln = 1.1;
      deaths++;
    }

    function spawnParticles(x, y, color, n) {
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2;
        const spd = 30 + Math.random() * 90;
        particles.push({ x, y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, life: 0.4 + Math.random() * 0.3, maxLife: 0.7, color });
      }
    }

    // ================= update =================
    function update(dt) {
      animT += dt;
      if (state === 'playing') elapsed += dt;

      if (state !== 'playing') {
        player.walkT += dt;
        return;
      }

      // ---- input / movement ----
      let moving = false;
      player.vx = 0;
      if (keys.a) { player.vx = -MOVE_SPEED; player.facing = -1; moving = true; }
      if (keys.d) { player.vx = MOVE_SPEED; player.facing = 1; moving = true; }

      if (player.grounded) player.coyote = COYOTE_TIME; else player.coyote -= dt;
      if (player.jumpBuffer > 0) player.jumpBuffer -= dt;
      if (player.jumpBuffer > 0 && player.coyote > 0) {
        player.vy = JUMP_V;
        player.jumpBuffer = 0;
        player.coyote = 0;
      }

      if (moving || !player.grounded) idleTimer = 0; else idleTimer += dt;

      player.vy += GRAVITY * dt;
      if (player.vy > MAX_FALL) player.vy = MAX_FALL;

      // ---- collision ----
      const list = activeSolids();
      player.x += player.vx * dt;
      list.forEach((s) => {
        if (rectOverlap(player, s)) {
          if (player.vx > 0) player.x = s.x - player.w;
          else if (player.vx < 0) player.x = s.x + s.w;
        }
      });
      player.x = Math.max(0, Math.min(player.x, LEVEL_W - player.w));

      player.y += player.vy * dt;
      player.grounded = false;
      list.forEach((s) => {
        if (rectOverlap(player, s)) {
          if (player.vy > 0) { player.y = s.y - player.h; player.vy = 0; player.grounded = true; }
          else if (player.vy < 0) { player.y = s.y + s.h; player.vy = 0; }
        }
      });

      if (moving && player.grounded) player.walkT += dt; else if (!player.grounded) player.walkT += dt * 0.6;

      if (player.micCooldown > 0) player.micCooldown -= dt;
      if (player.invuln > 0) player.invuln -= dt;

      // ---- fell into a pit ----
      if (player.y > LEVEL_H + 40) { spawnParticles(player.x + 5, 120, '#ff6b5e', 14); respawnPlayer(); }

      // ---- glitch platform decay ----
      if (glitchPlat.active) {
        glitchPlat.timer -= dt;
        if (glitchPlat.timer <= 0) glitchPlat.active = false;
      }

      // ---- drone ----
      if (drone.disabledTimer > 0) {
        drone.disabledTimer -= dt;
      } else {
        drone.x += drone.dir * drone.speed * dt;
        if (drone.x < drone.minX) { drone.x = drone.minX; drone.dir = 1; }
        if (drone.x > drone.maxX) { drone.x = drone.maxX; drone.dir = -1; }
        if (player.invuln <= 0 && rectOverlap(player, drone)) {
          spawnParticles(player.x + 5, player.y + 5, '#ff6b5e', 14);
          respawnPlayer();
        }
      }

      // ---- laser eye ----
      laserEye.t += dt;
      if (laserEye.t > laserEye.cycle) laserEye.t -= laserEye.cycle;
      const beamActive = laserEye.t > 1.8;
      if (beamActive && player.invuln <= 0) {
        const beamRect = { x: laserEye.x - laserEye.w / 2, y: laserEye.y, w: laserEye.w, h: 164 - laserEye.y };
        if (rectOverlap(player, beamRect)) {
          spawnParticles(player.x + 5, player.y + 5, '#ff6b5e', 14);
          respawnPlayer();
        }
      }

      // ---- pulses vs hackable targets ----
      pulses.forEach((p) => {
        p.r += 170 * dt;
        const gc = { x: glitchPlat.x + glitchPlat.w / 2, y: glitchPlat.y + glitchPlat.h / 2 };
        if (!p.hitGlitch && !glitchPlat.active && p.r >= dist(p.x, p.y, gc.x, gc.y)) {
          p.hitGlitch = true;
          glitchPlat.active = true;
          glitchPlat.timer = glitchPlat.maxTimer;
          showMessage(T('platformStabilized'), 1.1, '#f3ba2f');
        }
        const dc = { x: drone.x + drone.w / 2, y: drone.y + drone.h / 2 };
        if (!p.hitDrone && drone.disabledTimer <= 0 && p.r >= dist(p.x, p.y, dc.x, dc.y)) {
          p.hitDrone = true;
          drone.disabledTimer = 4;
          showMessage(T('droneDisabled'), 1.1, '#f3ba2f');
        }
        const sc = { x: switchObj.x + switchObj.w / 2, y: switchObj.y + switchObj.h / 2 };
        if (!p.hitSwitch && !switchObj.activated && p.r >= dist(p.x, p.y, sc.x, sc.y)) {
          p.hitSwitch = true;
          switchObj.activated = true;
          gate.open = true;
          showMessage(T('gateOpened'), 1.1, '#f3ba2f');
        }
      });
      pulses = pulses.filter((p) => p.r < p.maxR);

      // ---- pickups ----
      if (!micPickup.collected && rectOverlap(player, micPickup)) {
        micPickup.collected = true;
        player.micUnlocked = true;
        spawnParticles(micPickup.x + 5, micPickup.y + 5, '#f3ba2f', 16);
        showMessage(T('micUnlockedMsg'), 1.6, '#f3ba2f');
        updateMicStatusLabel();
      }
      dataBlocks.forEach((b) => {
        if (!b.collected && rectOverlap(player, b)) {
          b.collected = true;
          dataCount++;
          document.getElementById('data-label').textContent = dataCount + '/' + TOTAL_DATA;
          spawnParticles(b.x + 5, b.y + 5, '#f3ba2f', 16);
        }
      });

      // ---- win ----
      if (dataCount >= TOTAL_DATA && rectOverlap(player, server)) {
        state = 'win';
      }

      // ---- particles ----
      particles.forEach((p) => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; p.life -= dt; });
      particles = particles.filter((p) => p.life > 0);

      if (hudMessageTimer > 0) { hudMessageTimer -= dt; if (hudMessageTimer <= 0) hudMessage = null; }

      // ---- camera ----
      const targetCam = player.x - GAME_W / 2 + player.w / 2;
      camera.x += (targetCam - camera.x) * Math.min(1, dt * 6);
      camera.x = Math.max(0, Math.min(camera.x, LEVEL_W - GAME_W));
    }

    // ================= expression state =================
    function currentExpression() {
      if (player.invuln > 0.6 || player.vy > 170) return 'shocked';
      const nearLaser = player.x > laserEye.x - 60 && player.x < laserEye.x + 30;
      const onGlitch = glitchPlat.active && player.x + player.w > glitchPlat.x - 4 && player.x < glitchPlat.x + glitchPlat.w + 4;
      if (nearLaser || onGlitch) return 'nervous';
      if (idleTimer > 6) return 'exhausted';
      return 'skeptical';
    }

    // ================= render =================
    function drawFace(cx, cy, expr, scale) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(scale, scale);
      ctx.fillStyle = '#141414';
      if (expr === 'shocked') {
        ctx.fillRect(-3, -1, 2, 2); ctx.fillRect(1, -1, 2, 2);
        ctx.fillRect(-1, 2, 2, 2);
      } else if (expr === 'nervous') {
        ctx.fillRect(-3, 0, 2, 1); ctx.fillRect(1, 0, 2, 1);
        ctx.fillRect(-2, 3, 4, 1);
        ctx.fillStyle = '#8ec9ff';
        ctx.fillRect(3, -3, 1, 3);
      } else if (expr === 'exhausted') {
        ctx.fillRect(-3, 0, 2, 1); ctx.fillRect(1, 0, 2, 1);
        ctx.fillRect(-2, 4, 4, 1);
      } else {
        ctx.fillRect(-3, -1, 2, 1); ctx.fillRect(1, -1, 2, 1);
        ctx.fillRect(-2, 3, 4, 1);
      }
      ctx.restore();
    }

    function drawPlayer() {
      const p = player;
      const bob = p.grounded && Math.abs(p.vx) > 1 ? Math.sin(p.walkT * 10) * 1 : 0;
      const legOffset = p.grounded ? (Math.abs(p.vx) > 1 ? Math.sin(p.walkT * 10) * 2 : 0) : 0;

      ctx.save();
      const cx = p.x + p.w / 2;
      ctx.translate(cx, p.y + bob);
      ctx.scale(p.facing, 1);
      ctx.translate(-p.w / 2, 0);

      // legs
      ctx.fillStyle = COL.pants;
      ctx.fillRect(1, 11 + Math.max(0, legOffset), 3, 5 - Math.max(0, legOffset));
      ctx.fillRect(6, 11 + Math.max(0, -legOffset), 3, 5 - Math.max(0, -legOffset));
      ctx.fillStyle = COL.shoe;
      ctx.fillRect(1, 15, 3, 1);
      ctx.fillRect(6, 15, 3, 1);

      // body
      ctx.fillStyle = COL.shirt;
      ctx.fillRect(0, 4, 10, 8);
      ctx.fillStyle = COL.accent;
      ctx.fillRect(3, 6, 2, 2);

      // arm + mic
      if (p.micUnlocked) {
        ctx.fillStyle = COL.skin;
        ctx.fillRect(8, 6, 2, 4);
        ctx.fillStyle = COL.mic;
        ctx.fillRect(9, 3, 2, 4);
      } else {
        ctx.fillStyle = COL.skin;
        ctx.fillRect(-1, 6, 2, 4);
      }

      // head
      ctx.fillStyle = COL.skin;
      ctx.fillRect(1, -3, 8, 7);

      ctx.restore();

      const expr = currentExpression();
      const flashOff = p.invuln > 0 && Math.floor(p.invuln * 14) % 2 === 0;
      if (!flashOff) drawFace(cx, p.y + bob + 0.5, expr, 1);

      return expr;
    }

    function drawDiamond(cx, cy, r, glow) {
      ctx.save();
      if (glow) { ctx.shadowColor = '#f3ba2f'; ctx.shadowBlur = 6; }
      ctx.fillStyle = '#f3ba2f';
      ctx.beginPath();
      ctx.moveTo(cx, cy - r); ctx.lineTo(cx + r, cy); ctx.lineTo(cx, cy + r); ctx.lineTo(cx - r, cy);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#0a0a0a';
      ctx.beginPath();
      ctx.moveTo(cx, cy - r * 0.4); ctx.lineTo(cx + r * 0.4, cy); ctx.lineTo(cx, cy + r * 0.4); ctx.lineTo(cx - r * 0.4, cy);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }

    function drawEyeIcon(x, y, w, h) {
      ctx.fillStyle = '#111';
      ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = '#f3ba2f';
      ctx.lineWidth = 1;
      ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
      const cx = x + w / 2, cy = y + h / 2;
      ctx.strokeStyle = 'rgba(243,186,47,0.8)';
      ctx.beginPath();
      ctx.ellipse(cx, cy, w / 2 - 2, h / 2 - 3, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = '#f3ba2f';
      ctx.beginPath();
      ctx.arc(cx, cy, 1.4, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawBackground() {
      ctx.fillStyle = '#0d0d0d';
      ctx.fillRect(0, 0, GAME_W, GAME_H);

      // parallax office windows
      const parX = -(camera.x * 0.3) % 40;
      ctx.strokeStyle = 'rgba(243,186,47,0.10)';
      ctx.lineWidth = 1;
      for (let x = parX - 40; x < GAME_W + 40; x += 40) {
        ctx.strokeRect(x + 4, 20, 22, 30);
      }

      // binary ticker
      ctx.font = '7px monospace';
      ctx.fillStyle = 'rgba(122,154,74,0.35)';
      const offset = Math.floor((camera.x * 0.6 + animT * 22)) % binaryStr.length;
      const strip = (binaryStr + binaryStr).slice(offset, offset + 60);
      ctx.fillText(strip.split('').join(' '), -10, 12);
    }

    function render() {
      drawBackground();

      ctx.save();
      ctx.translate(-camera.x, 0);

      // decorative monitors
      monitors.forEach((m) => drawEyeIcon(m.x, m.y, 16, 12));

      // platforms
      solids.forEach((s) => {
        ctx.fillStyle = COL.floor;
        ctx.fillRect(s.x, s.y, s.w, Math.min(s.h, GAME_H - s.y));
        ctx.fillStyle = COL.floorEdge;
        ctx.fillRect(s.x, s.y, s.w, 2);
      });

      // gate
      if (!gate.open) {
        ctx.fillStyle = '#c1443c';
        for (let i = 0; i < gate.h; i += 6) {
          ctx.fillRect(gate.x, gate.y + i, gate.w, 3);
        }
      } else {
        ctx.strokeStyle = 'rgba(122,154,74,0.6)';
        ctx.setLineDash([3, 3]);
        ctx.strokeRect(gate.x, gate.y, gate.w, gate.h);
        ctx.setLineDash([]);
      }

      // glitch platform
      if (glitchPlat.active) {
        ctx.fillStyle = COL.glitchOn;
        ctx.shadowColor = COL.glitchOn; ctx.shadowBlur = 6;
        ctx.fillRect(glitchPlat.x, glitchPlat.y, glitchPlat.w, glitchPlat.h);
        ctx.shadowBlur = 0;
        const pct = glitchPlat.timer / glitchPlat.maxTimer;
        ctx.fillStyle = '#0a0a0a';
        ctx.fillRect(glitchPlat.x, glitchPlat.y - 4, glitchPlat.w, 2);
        ctx.fillStyle = '#f3ba2f';
        ctx.fillRect(glitchPlat.x, glitchPlat.y - 4, glitchPlat.w * pct, 2);
      } else {
        const a = 0.18 + Math.sin(animT * 8) * 0.08;
        ctx.strokeStyle = `rgba(243,186,47,${a})`;
        ctx.setLineDash([3, 2]);
        ctx.strokeRect(glitchPlat.x, glitchPlat.y, glitchPlat.w, glitchPlat.h);
        ctx.setLineDash([]);
      }

      // switch
      ctx.fillStyle = '#333';
      ctx.fillRect(switchObj.x + 3, switchObj.y + 4, 4, 8);
      ctx.fillStyle = switchObj.activated ? '#7a9a4a' : '#c1443c';
      ctx.beginPath();
      ctx.arc(switchObj.x + 5, switchObj.y + 3, 3, 0, Math.PI * 2);
      ctx.fill();

      // drone
      ctx.save();
      ctx.globalAlpha = drone.disabledTimer > 0 ? 0.4 : 1;
      ctx.fillStyle = drone.disabledTimer > 0 ? '#555' : '#2c2c2c';
      ctx.fillRect(drone.x, drone.y, drone.w, drone.h);
      ctx.fillStyle = drone.disabledTimer > 0 ? '#888' : '#ff6b5e';
      ctx.beginPath();
      ctx.arc(drone.x + drone.w / 2, drone.y + drone.h / 2, 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // laser eye
      ctx.fillStyle = '#222';
      ctx.fillRect(laserEye.x - 5, laserEye.y - 6, 10, 8);
      const beamActive = laserEye.t > 1.8;
      const warn = laserEye.t > 1.5 && laserEye.t <= 1.8;
      if (beamActive) {
        ctx.fillStyle = 'rgba(255,90,80,0.85)';
        ctx.shadowColor = '#ff5a50'; ctx.shadowBlur = 6;
        ctx.fillRect(laserEye.x - laserEye.w / 2, laserEye.y, laserEye.w, 164 - laserEye.y);
        ctx.shadowBlur = 0;
      } else if (warn) {
        if (Math.floor(animT * 20) % 2 === 0) {
          ctx.fillStyle = 'rgba(255,90,80,0.35)';
          ctx.fillRect(laserEye.x - 1, laserEye.y, 2, 164 - laserEye.y);
        }
      }
      ctx.fillStyle = beamActive ? '#ff5a50' : '#7a1a15';
      ctx.beginPath(); ctx.arc(laserEye.x, laserEye.y - 2, 2, 0, Math.PI * 2); ctx.fill();

      // mic pickup
      if (!micPickup.collected) {
        const bob = Math.sin(animT * 3) * 1.5;
        ctx.fillStyle = COL.mic;
        ctx.fillRect(micPickup.x, micPickup.y + bob, micPickup.w, micPickup.h);
        ctx.fillStyle = '#444';
        ctx.fillRect(micPickup.x + 2, micPickup.y + micPickup.h + bob, 6, 2);
      }

      // data blocks
      dataBlocks.forEach((b) => {
        if (b.collected) return;
        const bob = Math.sin(animT * 4 + b.x) * 1.2;
        drawDiamond(b.x + b.w / 2, b.y + b.h / 2 + bob, 6, true);
      });

      // pulses
      pulses.forEach((p) => {
        ctx.strokeStyle = `rgba(243,186,47,${Math.max(0, 1 - p.r / p.maxR)})`;
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.stroke();
      });

      // particles
      particles.forEach((pt) => {
        ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife);
        ctx.fillStyle = pt.color;
        ctx.fillRect(pt.x, pt.y, 2, 2);
      });
      ctx.globalAlpha = 1;

      // server terminal
      ctx.fillStyle = '#1a1a1a';
      ctx.fillRect(server.x, server.y, server.w, server.h);
      ctx.fillStyle = dataCount >= TOTAL_DATA ? '#7a9a4a' : '#c1443c';
      ctx.fillRect(server.x + 4, server.y + 4, server.w - 8, 10);
      drawEyeIcon(server.x + 4, server.y + 18, server.w - 8, 10);

      const expr = drawPlayer();

      const hint = computeHint();
      if (hint) drawWorldLabel(hint.text, hint.x, hint.y);

      ctx.restore();

      // ---- HUD ----
      drawHUDPortrait(expr);
      drawHudMessage();
      drawOverlays();
    }

    function drawWorldLabel(text, cx, y) {
      ctx.font = bodyFont(7);
      ctx.textAlign = 'center';
      const w = ctx.measureText(text).width;
      ctx.fillStyle = 'rgba(0,0,0,0.65)';
      ctx.fillRect(cx - w / 2 - 3, y - 8, w + 6, 10);
      ctx.fillStyle = '#f3ba2f';
      ctx.fillText(text, cx, y);
    }

    function drawHudMessage() {
      if (!hudMessage) return;
      ctx.textAlign = 'center';
      ctx.font = bodyFont(9);
      const w = ctx.measureText(hudMessage).width;
      ctx.globalAlpha = Math.min(1, hudMessageTimer * 3);
      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      ctx.fillRect(GAME_W / 2 - w / 2 - 5, 24, w + 10, 12);
      ctx.fillStyle = hudMessageColor;
      ctx.fillText(hudMessage, GAME_W / 2, 33);
      ctx.globalAlpha = 1;
    }

    function computeHint() {
      if (state !== 'playing') return null;

      if (!micPickup.collected && dist(player.x, player.y, micPickup.x, micPickup.y) < 55) {
        return { text: T('walkIntoMic'), x: micPickup.x + 5, y: micPickup.y - 8 };
      }

      const glitchCx = glitchPlat.x + glitchPlat.w / 2;
      if (!glitchPlat.active && Math.abs(player.x - glitchCx) < 65) {
        return { text: player.micUnlocked ? T('jToStabilize') : T('needTheMic'), x: glitchCx, y: glitchPlat.y - 12 };
      }

      if (drone.disabledTimer <= 0 && Math.abs(player.x - (drone.x + drone.w / 2)) < 70 && player.x < drone.maxX + 20) {
        return { text: player.micUnlocked ? T('jToDisableDrone') : T('needTheMic'), x: drone.x + drone.w / 2, y: drone.y - 12 };
      }

      if (!switchObj.activated && Math.abs(player.x - switchObj.x) < 55) {
        return { text: player.micUnlocked ? T('jToHackSwitch') : T('needTheMic'), x: switchObj.x + 5, y: switchObj.y - 14 };
      }

      if (player.x > laserEye.x - 110 && player.x < laserEye.x - 15) {
        return { text: T('timeTheLaser'), x: laserEye.x, y: laserEye.y - 14 };
      }

      if (dataCount < TOTAL_DATA && dist(player.x, player.y, server.x, server.y) < 75) {
        return { text: T('needMoreData', { n: TOTAL_DATA - dataCount }), x: server.x + server.w / 2, y: server.y - 10 };
      }

      return null;
    }

    function drawHUDPortrait(expr) {
      if (state !== 'playing') return;
      ctx.save();
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(4, 4, 22, 20);
      ctx.strokeStyle = 'rgba(243,186,47,0.6)';
      ctx.strokeRect(4.5, 4.5, 21, 19);
      ctx.fillStyle = COL.skin;
      ctx.fillRect(9, 8, 12, 10);
      drawFace(15, 13, expr, 1.4);
      ctx.restore();
    }

    function drawOverlays() {
      ctx.textAlign = 'center';
      if (state === 'ready') {
        ctx.fillStyle = 'rgba(0,0,0,0.35)';
        ctx.fillRect(0, 0, GAME_W, GAME_H);
        ctx.font = markerFont(18);
        ctx.fillStyle = '#f3ba2f';
        ctx.fillText('CRYPTO CAPER', GAME_W / 2, GAME_H * 0.38);
        ctx.font = bodyFont(10);
        ctx.fillStyle = 'rgba(251,251,243,0.85)';
        ctx.fillText(T('readyWasd'), GAME_W / 2, GAME_H * 0.48);
        ctx.fillStyle = '#f3ba2f';
        ctx.fillText(T('readyFindMic'), GAME_W / 2, GAME_H * 0.57);
        ctx.fillStyle = 'rgba(251,251,243,0.85)';
        const bob = Math.sin(animT * 3) * 2;
        ctx.fillText(T('pressAnyKey'), GAME_W / 2, GAME_H * 0.76 + bob);
      }

      if (state === 'win') {
        ctx.fillStyle = 'rgba(0,0,0,0.65)';
        ctx.fillRect(0, 0, GAME_W, GAME_H);
        ctx.font = markerFont(18);
        ctx.fillStyle = '#7a9a4a';
        ctx.fillText(T('networkSecured'), GAME_W / 2, GAME_H * 0.38);
        ctx.font = bodyFont(10);
        ctx.fillStyle = '#fbfbf3';
        ctx.fillText(T('timeLabel') + '  ' + elapsed.toFixed(1) + 's', GAME_W / 2, GAME_H * 0.52);
        ctx.fillStyle = '#f3ba2f';
        ctx.fillText(T('deathsLabel') + '  ' + deaths, GAME_W / 2, GAME_H * 0.60);
        ctx.fillStyle = 'rgba(251,251,243,0.7)';
        ctx.fillText(T('replayPrompt'), GAME_W / 2, GAME_H * 0.72);
      }
    }

    window.addEventListener('keydown', (e) => {
      if (state === 'win' && (e.code === 'KeyR')) resetLevel();
    });

    function resetLevel() {
      player.x = SPAWN.x; player.y = SPAWN.y; player.vx = 0; player.vy = 0;
      player.micUnlocked = false; player.micCooldown = 0; player.invuln = 0;
      micPickup.collected = false;
      dataBlocks.forEach((b) => (b.collected = false));
      dataCount = 0;
      document.getElementById('data-label').textContent = '0/' + TOTAL_DATA;
      updateMicStatusLabel();
      hudMessage = null; hudMessageTimer = 0;
      gate.open = false; switchObj.activated = false;
      glitchPlat.active = false; glitchPlat.timer = 0;
      drone.x = drone.minX; drone.dir = 1; drone.disabledTimer = 0;
      laserEye.t = 0;
      pulses = []; particles = [];
      elapsed = 0; deaths = 0; idleTimer = 0;
      camera.x = 0;
      state = 'ready';
    }

    // ================= loop =================
    let lastTime = null;
    function loop(t) {
      if (lastTime == null) lastTime = t;
      let dt = (t - lastTime) / 1000;
      lastTime = t;
      dt = Math.min(dt, 0.033);

      update(dt);
      render();

      requestAnimationFrame(loop);
    }

    fitCanvas();
    applyLang(getLang());
    requestAnimationFrame(loop);

    const vid = document.getElementById('bgvideo');
    vid.play().catch(() => {});
  </script>
</body>
